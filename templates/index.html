{% extends "layout.html" %}

{% block title %}Inicio - Optimizador de Corte{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h2 class="card-title">Bienvenido al Optimizador de Corte</h2>

        </div>
    </div>
</div>
{% endblock %}
